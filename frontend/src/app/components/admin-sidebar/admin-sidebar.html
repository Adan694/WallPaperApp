<nav class="admin-sidebar">
  <!-- Logo Section -->
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">🎨</span>
      <h1>Wallpapers Admin</h1>
    </div>
  </div>

  <!-- Navigation Menu -->
  <ul class="sidebar-menu">
    <li class="menu-item" *ngFor="let item of menuItems" [class.active]="isActive(item.path)">
      <a [routerLink]="item.path" class="menu-link" routerLinkActive="active">
        <span class="menu-icon">{{ item.icon }}</span>
        <span class="menu-text">{{ item.label }}</span>
      </a>
    </li>
  </ul>

  <!-- User Info & Logout -->
  <div class="sidebar-footer">
    <div class="user-info">
      <span class="user-avatar">👤</span>
      <div class="user-details">
        <span class="user-name">{{ authService.getCurrentUser()?.name }}</span>
        <span class="user-role">Administrator</span>
      </div>
      <button class="logout-btn" (click)="logout()" title="Logout">🚪</button>
    </div>
  </div>
</nav>
