<app-toast [message]="toastMessage" [type]="toastType"></app-toast>

<app-navbar></app-navbar>

<div class="dynamic-bg" *ngIf="wallpaper">
  <img [src]="wallpaper.imageUrl" class="blur-bg" alt="Image" />
</div>
<app-modal
  [isOpen]="showModal"
  title="Remove Wallpaper"
  message="Are you sure you want to remove this wallpaper from favorites?"
  (onConfirm)="removeFromFavorites()"
  (onClose)="closeModal()"
></app-modal>

<div class="wallpaper-page py-5">
  <div class="container mt-5" *ngIf="!isLoading && wallpaper; else loading">
    <div class="row align-items-center justify-content-center py-5">
      <!-- Image Section -->
      <div class="col-lg-6 text-center mb-4 mb-lg-0">
        <div class="image-wrapper shadow-lg rounded-4 overflow-hidden">
          <img [src]="wallpaper.imageUrl" alt="image" class="img-fluid wallpaper-img" />
        </div>
      </div>

      <!-- Details Section -->
      <div class="col-lg-6">
        <div class="details-card p-4 rounded-4 shadow-sm">
          <h1 class="display-5 fw-bold mb-3 text-primary">{{ wallpaper.title }}</h1>
          <p class="text-muted mb-2"><strong>Category:</strong> {{ wallpaper.category }}</p>
          <p class="lead mb-4">{{ wallpaper.description }}</p>

          <div class="d-flex flex-wrap gap-3">
            <button class="btn btn-download btn-lg shadow" (click)="downloadWallpaper()">
              Download
            </button>
            <app-like-button
              *ngIf="wallpaper"
              [wallpaperId]="wallpaper.id"
              [likes]="wallpaper.likes"
            ></app-like-button>
            <button
              class="btn btn-favorite btn-lg shadow-sm"
              *ngIf="!isFavorite()"
              (click)="addToFavorites()"
            >
              <i class="bi bi-heart me-2"></i> Add to Favorites
            </button>

            <button
              class="btn btn-favorite btn-lg shadow-sm btn-danger"
              *ngIf="isFavorite()"
              (click)="openModal()"
            >
              <i class="bi bi-trash me-2"></i> Remove from Favorites
            </button>

            <button
              class="btn btn-share btn-lg shadow-sm d-flex align-items-center gap-2"
              (click)="share()"
            >
              <i class="bi bi-share"></i> Share
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Spinner -->
  <ng-template #loading>
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-3 text-muted">Loading wallpaper...</p>
    </div>
  </ng-template>
</div>
