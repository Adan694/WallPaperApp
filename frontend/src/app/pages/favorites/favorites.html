<app-navbar></app-navbar>

<!-- Reusable Modal -->
<app-modal
  [isOpen]="showModal"
  title="Remove Wallpaper"
  message="Are you sure you want to remove this wallpaper from favorites?"
  (onConfirm)="removeFromFavorites(selectedId)"
  (onClose)="closeModal()"
></app-modal>

<div class="favorites-container py-5">
  <div class="container text-center">
    <h1 class="display-5 fw-bold text-light mb-4">
      <i class="bi bi-heart-fill text-danger me-2"></i> My Favorites
    </h1>

    <!-- If no favorites -->
    <div *ngIf="favorites.length === 0" class="no-favorites">
      <i class="bi bi-emoji-frown text-light fs-1 mb-3"></i>
      <p class="lead text-light">You haven't added any wallpapers yet.</p>
      <a routerLink="/" class="btn btn-outline-light mt-3"> Browse Wallpapers </a>
    </div>

    <!-- Favorites Grid -->
    <div class="row g-4 justify-content-center" *ngIf="favorites.length > 0">
      <div class="col-md-4 col-sm-6" *ngFor="let wall of favorites">
        <div class="favorite-card shadow-lg rounded-4 overflow-hidden position-relative">
          <img [src]="wall.imageUrl" [alt]="wall.title" class="img-fluid favorite-img" />
          <div class="favorite-overlay p-3 text-start">
            <h5 class="fw-bold text-white mb-1">{{ wall.title }}</h5>
            <small class="text-light">{{ wall.category }}</small>
            <div class="mt-3 d-flex justify-content-between align-items-center">
              <button class="btn btn-outline-light btn-sm" (click)="viewWallpaper(wall.id)">
                View
              </button>
              <button class="btn btn-danger btn-sm" (click)="openModal(wall.id)">
                Remove <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
