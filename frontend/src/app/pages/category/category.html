<app-navbar></app-navbar>

<div class="category-page" [ngStyle]="{ 'background-color': theme.secondary }">
  <div class="container py-5">
    <!-- Heading -->
    <h1 class="category-title mb-4" [ngStyle]="{ color: theme.primary }">
      {{ categoryName }} Wallpapers
    </h1>

    <!-- Wallpapers Grid -->
    <div class="row g-4" *ngIf="filteredWallpapers.length; else noWallpapers">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let w of filteredWallpapers">
        <div class="wallpaper-card position-relative overflow-hidden rounded shadow-sm">
          <img
            [src]="w.imageUrl"
            [alt]="w.title || 'Wallpaper'"
            title="Wallpaper image"
            class="card-img"
          />
          <div class="overlay d-flex flex-column justify-content-end p-3">
            <h5 class="overlay-title mb-1">{{ w.title }}</h5>
            <p class="overlay-category mb-0">{{ categoryName }}</p>
            <button
              class="btn btn-sm btn-outline-light mt-2"
              (click)="goToWallpaper(w.id); $event.stopPropagation()"
            >
              View
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Fallback template -->
    <ng-template #noWallpapers>
      <div class="text-center py-5">
        <h4 class="text-muted">No wallpapers found for this category.</h4>
        <p>Try searching for something else or explore another category!</p>
      </div>
    </ng-template>
  </div>
</div>
